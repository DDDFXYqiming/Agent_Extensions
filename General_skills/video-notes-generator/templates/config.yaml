# Human reference only; the script uses CLI flags/environment, not this YAML.
cli:
  usage: 'python scripts/video_to_notes.py "<url>" -o ./notes --frame-interval 30 --max-frames 24'
  review: 'python scripts/video_to_notes.py --review-manifest ./notes/ID_visual_manifest.json --timestamps 12,13,14'
frames:
  max_agent_frames_env: VIDEO_NOTES_MAX_AGENT_FRAMES
  default_max_frames: 24
  frame_max_width_env: VIDEO_NOTES_FRAME_MAX_WIDTH
  default_width: 960
  supplemental_width: 0
agent_workflow:
  - Read complete transcript_chunks and visual_manifest.
  - Inspect sheets and related frames with matching text.
  - Supplement ambiguous intervals and unreadable details.
  - Write final_notes and evidence.json after actual review.
