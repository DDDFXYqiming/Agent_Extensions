name: dsh-memory CI

on:
  push:
    paths:
      - 'dsh-plugins/dsh-memory/**'
  pull_request:
    paths:
      - 'dsh-plugins/dsh-memory/**'

jobs:
  build-test-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh-plugins/dsh-memory
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # dsh-tools 当前 npm 上存在 dsh-type-meta 缺失问题，因此不通过 pnpm 安装项目 peerDependencies；
      # 只安装测试框架 vitest，并用 --legacy-peer-deps 跳过 peer 自动安装。
      - name: Install test dependencies
        run: npm install --no-save --legacy-peer-deps vitest

      - name: Build / syntax check
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Smoke load into a fresh DSH profile
        run: |
          npm i -g @deepseek-ai/dsh
          dsh plugin --profile smoke add ./dsh-plugins/dsh-memory
          dsh --profile smoke --dump-config | grep -A2 'dsh-memory'
